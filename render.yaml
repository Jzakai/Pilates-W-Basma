# One-click deploy on Render (https://render.com) — Dashboard → New → Blueprint → pick this repo.
# Data lives in Supabase (Postgres + Storage), so restarts on the free plan lose nothing.
# The free plan still sleeps when idle (see README → Deploying on Render).
services:
  - type: web
    name: pilates-w-basma
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/studio
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false   # Render asks you to type it when you create the service
      - key: DATABASE_URL
        sync: false   # Supabase session pooler connection string
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
