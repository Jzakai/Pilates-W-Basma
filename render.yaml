# One-click deploy on Render (https://render.com) — Dashboard → New → Blueprint → pick this repo.
# The free plan is for testing: it sleeps when idle and its disk is wiped on every
# restart/deploy, so bookings do not survive. For real use switch to a paid plan
# and add a disk (see README → Deploying).
services:
  - type: web
    name: pilates-w-basma
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/studio
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false   # Render asks you to type it when you create the service
